name: Deploy Dylan Helping Hand

on:
  push:
    branches: [main]
    paths:
      - 'dylan-helping-hand/**'
      - '.github/workflows/dylan-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dylan-helping-hand
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
